# Generated by Aegis, adapted for the bundled test app (webapp/app.py).
# For a real app you would set DAST_USERNAME/DAST_PASSWORD as repository secrets;
# this throwaway uses literal test credentials so no secret setup is needed.
name: dast
'on':
  workflow_dispatch: {}
  schedule:
    - cron: 0 3 * * *
permissions:
  contents: read
jobs:
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Start the application
        run: |
          pip install flask
          nohup python webapp/app.py > app.log 2>&1 &
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:8080/login >/dev/null; do sleep 2; done'
          echo "app is up"
        env:
          DAST_TARGET_URL: http://127.0.0.1:8080
      - name: Run ZAP authenticated scan
        run: |
          docker run --network host -v ${{ github.workspace }}:/zap/wrk/:rw \
            -e DAST_TARGET_URL -e DAST_USERNAME -e DAST_PASSWORD \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd -autorun /zap/wrk/.zap/plan.yaml
        env:
          DAST_TARGET_URL: http://127.0.0.1:8080
          DAST_USERNAME: admin
          DAST_PASSWORD: admin
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: zap-report
          path: results.sarif
