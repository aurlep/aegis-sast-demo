# Generated by Aegis. Review before committing.
# Actions are pinned to commit SHAs (Dependabot keeps them current); each
# job reports rather than fails the build -- tighten once findings are triaged.
name: security
'on':
  push:
    branches:
      - main
  pull_request: {}
  schedule:
    - cron: 0 6 * * 1
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Report (Semgrep)
        run: semgrep scan --config p/default --sarif --output results.sarif
        env:
          SEMGREP_SEND_METRICS: 'off'
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: semgrep-report
          path: results.sarif
  bandit:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: 3.x
      - name: Install Bandit
        run: pip install 'bandit[sarif]'
      - name: Report (Bandit)
        run: bandit -r . -f sarif -o results.sarif || true
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: bandit-report
          path: results.sarif
  pip-audit:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: 3.x
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Report (pip-audit)
        run: pip-audit -f json -o pip-audit.json || true
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: pip-audit-report
          path: pip-audit.json
  gitleaks:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:v8.21.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: Report (Gitleaks)
        run: gitleaks detect --source . --report-format sarif --report-path results.sarif
          --exit-code 0 --no-banner
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: gitleaks-report
          path: results.sarif
