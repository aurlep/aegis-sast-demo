# Generated by Aegis from a recorded login flow. Review before committing.
# ZAP authenticates through the login page, then spiders and active-scans
# behind it. Credentials come from CI secrets, never this file.
#
# Recorded steps (browser auth auto-detects standard forms; translate to a
# Zest script if your login is non-standard):
#   1. fill #username ${DAST_USERNAME}
#   2. fill #password ${DAST_PASSWORD}
#   3. click #submit
env:
  contexts:
    - name: app
      urls:
        - ${DAST_TARGET_URL}
      includePaths:
        - ${DAST_TARGET_URL}.*
      authentication:
        method: browser
        parameters:
          loginPageUrl: ${DAST_TARGET_URL}/login
          loginPageWait: 5
          browserId: firefox-headless
        verification:
          method: poll
          pollFrequency: 60
          pollUnits: requests
          loggedInRegex: Sign out
      sessionManagement:
        method: cookie
      users:
        - name: recorded-user
          credentials:
            username: ${DAST_USERNAME}
            password: ${DAST_PASSWORD}
  parameters:
    failOnError: true
    progressToStdout: true
jobs:
  - type: spider
    parameters:
      context: app
      user: recorded-user
      maxDuration: 5
  - type: passiveScan-wait
    parameters:
      maxDuration: 5
  - type: activeScan
    parameters:
      context: app
      user: recorded-user
      maxRuleDurationInMins: 3
  - type: report
    parameters:
      template: sarif-json
      reportDir: /zap/wrk
      reportFile: results.sarif

